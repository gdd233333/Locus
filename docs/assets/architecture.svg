<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720" role="img" aria-label="Locus 架构总览">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#D9A566" fill-opacity="0.6"/>
    </marker>
    <radialGradient id="bg" cx="0.2" cy="0" r="1">
      <stop offset="0" stop-color="#D9A566" stop-opacity="0.10"/>
      <stop offset="0.6" stop-color="#D9A566" stop-opacity="0.02"/>
      <stop offset="1" stop-color="#D9A566" stop-opacity="0"/>
    </radialGradient>
    <style>
      .card { fill: #1C1A18; stroke: #E8E3DA; stroke-opacity: 0.08; }
      .inner { fill: #242120; stroke: #E8E3DA; stroke-opacity: 0.06; }
      .amber { fill: #D9A566; }
      .smoke { fill: #E8E3DA; }
      .stone { fill: #8A857C; }
      .dim { fill: #4A463F; }
      .t { font-family: system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif; }
      .h { font-size: 17px; font-weight: 600; }
      .s { font-size: 13px; }
      .l { font-size: 11px; letter-spacing: 1.5px; }
      .ln { stroke: #D9A566; stroke-opacity: 0.32; stroke-width: 1.5; fill: none; }
    </style>
  </defs>

  <rect width="1200" height="720" rx="24" fill="#12100F"/>
  <rect width="1200" height="720" rx="24" fill="url(#bg)"/>
  <rect x="0.5" y="0.5" width="1199" height="719" rx="23.5" fill="none" stroke="#E8E3DA" stroke-opacity="0.08"/>

  <text x="64" y="66" class="t l stone">ARCHITECTURE</text>
  <text x="64" y="98" class="t smoke" font-size="26" font-weight="600">架构总览</text>
  <line x1="64" y1="120" x2="1136" y2="120" stroke="#E8E3DA" stroke-opacity="0.08"/>

  <!-- UI 层 -->
  <rect x="64" y="152" width="700" height="118" rx="16" class="card"/>
  <text x="88" y="182" class="t l amber">UI · COMPOSE</text>
  <text x="88" y="208" class="t smoke h">四个 Tab 与全屏页</text>
  <rect x="88" y="222" width="150" height="30" rx="15" class="inner"/>
  <text x="163" y="242" class="t s stone" text-anchor="middle">守护 Sober</text>
  <rect x="250" y="222" width="150" height="30" rx="15" class="inner"/>
  <text x="325" y="242" class="t s stone" text-anchor="middle">灵感 Inspire</text>
  <rect x="412" y="222" width="150" height="30" rx="15" class="inner"/>
  <text x="487" y="242" class="t s stone" text-anchor="middle">记录 TimeLog</text>
  <rect x="574" y="222" width="150" height="30" rx="15" class="inner"/>
  <text x="649" y="242" class="t s stone" text-anchor="middle">复盘 Review</text>

  <!-- 设计系统 -->
  <rect x="64" y="286" width="700" height="64" rx="16" class="inner"/>
  <text x="88" y="312" class="t l stone">DESIGNSYSTEM</text>
  <text x="88" y="336" class="t s stone">theme（颜色 / 字体 / 间距 / 动效曲线）· component（AuroraBackground、bounceClick…）</text>

  <!-- ViewModel -->
  <rect x="64" y="382" width="700" height="88" rx="16" class="card"/>
  <text x="88" y="412" class="t l amber">VIEWMODEL</text>
  <text x="88" y="438" class="t smoke h">Sober / Inspire / TimeLog / Review</text>
  <text x="88" y="458" class="t s stone">构造注入 Repository 接口 · Factory 从 AppContainer 取单例</text>

  <!-- Repository -->
  <rect x="64" y="502" width="700" height="88" rx="16" class="card"/>
  <text x="88" y="532" class="t l amber">REPOSITORY</text>
  <text x="88" y="558" class="t smoke h">StreakRepository · ActivityRepository · TimeLogRepository</text>
  <text x="88" y="578" class="t s stone">接口即业务契约：Room 实现与 Fake 参考实现各一份</text>

  <!-- 数据层 -->
  <rect x="64" y="622" width="336" height="62" rx="16" class="inner"/>
  <text x="88" y="646" class="t l stone">ROOM</text>
  <text x="88" y="668" class="t s stone">locus.db · 5 表 + 聚合查询</text>
  <rect x="428" y="622" width="336" height="62" rx="16" class="inner"/>
  <text x="452" y="646" class="t l stone">DATASTORE</text>
  <text x="452" y="668" class="t s stone">设置：提醒开关 / 时间 / seedVersion</text>

  <!-- 右侧：系统集成 -->
  <rect x="820" y="152" width="316" height="438" rx="16" class="card"/>
  <text x="844" y="182" class="t l amber">系统集成</text>

  <rect x="844" y="202" width="268" height="112" rx="14" class="inner"/>
  <text x="866" y="230" class="t smoke h">桌面小组件 · Glance</text>
  <text x="866" y="254" class="t s stone">守护天数（可直接打卡）</text>
  <text x="866" y="276" class="t s stone">记录中（chronometer 计时）</text>
  <text x="866" y="298" class="t s dim">刷新：15 分钟周期 + 分钟级 tick</text>

  <rect x="844" y="330" width="268" height="112" rx="14" class="inner"/>
  <text x="866" y="358" class="t smoke h">通知 · WorkManager</text>
  <text x="866" y="382" class="t s stone">晚间守护提醒（可直接打卡）</text>
  <text x="866" y="404" class="t s stone">记录中常驻通知</text>
  <text x="866" y="426" class="t s dim">BOOT_COMPLETED 恢复调度</text>

  <rect x="844" y="458" width="268" height="112" rx="14" class="inner"/>
  <text x="866" y="486" class="t smoke h">Deep link</text>
  <text x="866" y="510" class="t s stone">locus://sober</text>
  <text x="866" y="532" class="t s stone">locus://timelog</text>
  <text x="866" y="554" class="t s dim">小组件 / 通知 → NavHost</text>

  <!-- 连线 -->
  <line x1="414" y1="270" x2="414" y2="286" class="ln" marker-end="url(#arrow)"/>
  <line x1="414" y1="350" x2="414" y2="382" class="ln" marker-end="url(#arrow)"/>
  <line x1="414" y1="470" x2="414" y2="502" class="ln" marker-end="url(#arrow)"/>
  <line x1="300" y1="590" x2="240" y2="622" class="ln" marker-end="url(#arrow)"/>
  <line x1="520" y1="590" x2="596" y2="622" class="ln" marker-end="url(#arrow)"/>
  <line x1="820" y1="371" x2="764" y2="371" class="ln" marker-end="url(#arrow)"/>
  <line x1="820" y1="530" x2="764" y2="530" class="ln" marker-end="url(#arrow)"/>

  <text x="1136" y="700" class="t l dim" text-anchor="end">LOCUS · v1.0.0</text>
</svg>
